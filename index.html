            width: 70px;
            height: 70px;
            margin: auto;
            margin-bottom: 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #172033;
            border: 1px solid #334155;

            font-size: 32px;
        }

        header h1 {
            font-size: 36px;
            margin-bottom: 12px;
        }

        header h1 span {
            color: #60a5fa;
        }

        header p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* CONTAINER */

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 0 auto;
            padding-bottom: 50px;
        }

        /* INFO */

        .info {
            margin-top: -10px;
            margin-bottom: 30px;

            padding: 20px;

            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 14px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .info h2 {
            font-size: 18px;
            margin-bottom: 5px;
        }

        .info p {
            color: #94a3b8;
            font-size: 14px;
        }

        .github-link {
            padding: 10px 16px;
            border-radius: 8px;

            background: #f8fafc;
            color: #0f172a;

            text-decoration: none;
            font-size: 14px;
            font-weight: bold;

            white-space: nowrap;
        }

        .github-link:hover {
            background: #dbeafe;
        }

        /* SEARCH */

        .search-box {
            margin-bottom: 25px;
        }

        .search-box input {
            width: 100%;
            padding: 15px 18px;

            border-radius: 10px;

            border: 1px solid #334155;
            background: #111827;

            color: white;
            font-size: 15px;

            outline: none;
        }

        .search-box input:focus {
            border-color: #60a5fa;
        }

        /* FILE */

        .section-title {
            margin-bottom: 15px;
            color: #cbd5e1;
            font-size: 18px;
        }

        .file-list {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 15px;
        }

        .file-card {
            background: #111827;

            border: 1px solid #1f2937;

            border-radius: 14px;

            padding: 20px;

            transition: 0.2s;
        }

        .file-card:hover {
            transform: translateY(-3px);
            border-color: #475569;
        }

        .file-icon {
            font-size: 30px;
            margin-bottom: 15px;
        }

        .file-name {
            font-weight: bold;
            font-size: 17px;

            word-break: break-word;

            margin-bottom: 8px;
        }

        .file-type {
            color: #64748b;
            font-size: 13px;

            margin-bottom: 18px;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 9px 13px;

            border-radius: 8px;

            border: none;

            cursor: pointer;

            font-size: 13px;

            text-decoration: none;
        }

        .view-btn {
            background: #2563eb;
            color: white;
        }

        .view-btn:hover {
            background: #1d4ed8;
        }

        .github-btn {
            background: #1f2937;
            color: #cbd5e1;

            border: 1px solid #334155;
        }

        .github-btn:hover {
            background: #334155;
        }

        /* STATUS */

        #status {
            text-align: center;
            color: #64748b;

            padding: 30px;
        }

        /* MODAL */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 999;

            padding: 20px;

            background: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            width: 100%;
            max-width: 1000px;

            height: 90vh;

            margin: auto;

            background: #020617;

            border: 1px solid #334155;

            border-radius: 14px;

            overflow: hidden;

            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 15px 20px;

            background: #111827;

            border-bottom: 1px solid #1f2937;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }

        .modal-title {
            font-size: 16px;
            font-weight: bold;

            word-break: break-word;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
        }

        .copy-btn,
        .close-btn {
            padding: 8px 12px;

            border-radius: 7px;

            border: 1px solid #334155;

            background: #1e293b;

            color: white;

            cursor: pointer;
        }

        .copy-btn:hover,
        .close-btn:hover {
            background: #334155;

            overflow: auto;

            padding: 20px;

            color: #dbeafe;

                monospace;

            font-size: 14px;

            line-height: 1.6;

            white-space: pre-wrap;

Memuat kode...

<script>


/* =========================================
   PENGATURAN REPOSITORY
========================================= */

const USERNAME = "SannMiata";

const REPOSITORY = "laprak";

const BRANCH = "main";


/* =========================================
   AMBIL FILE DARI GITHUB
========================================= */

async function loadFiles() {

    const apiURL =
        `https://api.github.com/repos/${USERNAME}/${REPOSITORY}/contents/`;

    try {

        const response =
            await fetch(apiURL);

        if (!response.ok) {

            throw new Error(
                "Repository tidak ditemukan"
            );

        }

        const files =
            await response.json();


        /*
            File yang akan ditampilkan:

            .py
            .ipynb
            .ipynb.txt
            .txt
        */

        const allowedFiles =
            files.filter(file => {

                if (file.type !== "file") {
                    return false;
                }

                return (
                    file.name.endsWith(".py") ||
                    file.name.endsWith(".ipynb") ||
                    file.name.endsWith(".ipynb.txt") ||
                    file.name.endsWith(".txt")
                );

            });


        displayFiles(allowedFiles);


    } catch (error) {

        document.getElementById("status").innerHTML =
            "❌ Gagal mengambil file dari GitHub.";

        console.error(error);

    }

}


/* =========================================
   TAMPILKAN FILE
========================================= */

function displayFiles(files) {

    const list =
        document.getElementById("fileList");

    const status =
        document.getElementById("status");


    list.innerHTML = "";


    if (files.length === 0) {

        status.innerHTML =
            "Belum ada file tugas yang ditemukan.";

        return;

    }


    status.innerHTML =
        `${files.length} file ditemukan`;


    files.forEach(file => {

        const card =
            document.createElement("div");

        card.className =
            "file-card";


        const githubURL =
            `https://github.com/${USERNAME}/${REPOSITORY}/blob/${BRANCH}/${file.path}`;


        card.innerHTML = `

            <div class="file-icon">
                ${getIcon(file.name)}
            </div>

            <div class="file-name">
                ${file.name}
            </div>

            <div class="file-type">
                ${getFileType(file.name)}
            </div>

            <div class="buttons">

                <button
                    class="btn view-btn"
                    onclick="showCode(
                        '${file.download_url}',
                        '${escapeText(file.name)}'
                    )">

                    Lihat File

                </button>


                <a
                    class="btn github-btn"
                    href="${githubURL}"
                    target="_blank">

                    GitHub ↗

                </a>

            </div>

        `;


        list.appendChild(card);

    });


    setupSearch();

}


/* =========================================
   ICON FILE
========================================= */

function getIcon(filename) {

    if (filename.endsWith(".py")) {
        return "🐍";
    }

    if (filename.endsWith(".ipynb")) {
        return "📓";
    }

    if (filename.endsWith(".ipynb.txt")) {
        return "📓";
    }

    return "📄";

}


/* =========================================
   TIPE FILE
========================================= */

function getFileType(filename) {

    if (filename.endsWith(".py")) {
        return "Python Source Code";
    }

    if (
        filename.endsWith(".ipynb") ||
        filename.endsWith(".ipynb.txt")
    ) {
        return "Jupyter Notebook";
    }

    return "Text File";

        `https://api.github.com/repos/${USERNAME}/${REPOSITORY}/contents/`;

    try {

        const response = await fetch(apiURL);

        if (!response.ok) {
            throw new Error("Repository tidak ditemukan");
        }

        const files = await response.json();

        // Mengambil file tugas yang ada di repository
        const allowedFiles = files.filter(file => {

            if (file.type !== "file") {
                return false;
            }

            return (
                file.name.endsWith(".py") ||

            );

        });

        displayFiles(allowedFiles);

    } catch (error) {

        console.error(error);

}

    if (files.length === 0) {

        `${files.length} file ditemukan`;

        card.className = "file-card";

        const githubURL =
            `https://github.com/${USERNAME}/${REPOSITORY}/blob/${BRANCH}/${file.path}`;

        card.innerHTML = `

            <div class="file-icon">
                ${getIcon(file.name)}
            </div>

            <div class="file-name">
                ${file.name}
            </div>

            <div class="file-type">
                ${getFileType(file.name)}
            </div>

            <div class="buttons">

                <button
                    class="btn view-btn"
                    onclick="showCode(
                        '${file.download_url}',
                        '${escapeText(file.name)}'
                    )">

                    Lihat File

                </button>

                <a

                    GitHub ↗

            </div>

    if (

        filename.endsWith(".ipynb.txt")
    ) {
        return "Jupyter Notebook";
    }

    return "Text File";
}


function escapeText(text) {

    return text
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"');
}


async function showCode(url, filename) {

    const modal = document.getElementById("modal");
    const title = document.getElementById("modalTitle");
    const code = document.getElementById("code");

    modal.style.display = "block";

    title.textContent = filename;
    code.textContent = "Memuat file...";

    try {

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error();
        }

        const text = await response.text();

        code.textContent = text;

    } catch (error) {

        code.textContent =
            "❌ Gagal mengambil isi file.";
    }
}


function copyCode() {

    const code =
        document.getElementById("code").textContent;

    navigator.clipboard.writeText(code);

    const button =
        document.querySelector(".copy-btn");

    button.textContent = "✓ Copied";

    setTimeout(() => {
        button.textContent = "Copy";
    }, 1500);
}


function closeModal() {

    document.getElementById("modal")
        .style.display = "none";
}


window.onclick = function(event) {

    const modal =
        document.getElementById("modal");

    if (event.target === modal) {
        closeModal();
    }

};


function setupSearch() {

    const search =
        document.getElementById("search");

    search.addEventListener("input", function() {

        const keyword =
            this.value.toLowerCase();

        const cards =
            document.querySelectorAll(".file-card");

        cards.forEach(card => {

            const name =
                card
                    .querySelector(".file-name")
                    .textContent
                    .toLowerCase();

            if (name.includes(keyword)) {
                card.style.display = "";
            } else {
                card.style.display = "none";
            }

        });

    });
}

loadFiles();

</script>
